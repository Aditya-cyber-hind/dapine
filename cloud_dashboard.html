<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☁️ Dapine Cloud</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
        .header{background:#161b22;padding:15px 30px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
        .header h1{color:#e94560;font-size:24px}
        .header span{color:#8b949e;font-size:14px}
        .container{max-width:1400px;margin:0 auto;padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
        .panel{background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:hidden}
        .panel-header{background:#1c2333;padding:12px 20px;font-weight:bold;font-size:14px;color:#58a6ff;border-bottom:1px solid #30363d}
        .panel-body{padding:20px}
        .upload-zone{border:2px dashed #30363d;border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all 0.3s}
        .upload-zone:hover{border-color:#58a6ff;background:#1a2332}
        .upload-zone.dragover{border-color:#238636;background:#1a2a1a}
        textarea{width:100%;min-height:200px;background:#0d1117;color:#7ee787;border:1px solid #30363d;border-radius:8px;padding:15px;font-family:'Cascadia Code',monospace;font-size:13px;resize:vertical}
        textarea:focus{outline:none;border-color:#58a6ff}
        .btn{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:13px;transition:all 0.2s;margin:3px}
        .btn:hover{transform:translateY(-2px);opacity:0.9}
        .btn-primary{background:#238636;color:white}
        .btn-secondary{background:#1f6feb;color:white}
        .btn-danger{background:#da3633;color:white}
        .btn-purple{background:#9c41f2;color:white}
        .output-area{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:15px;min-height:200px;max-height:500px;overflow-y:auto;font-family:monospace;font-size:12px;white-space:pre-wrap}
        .output-area .success{color:#7ee787}
        .output-area .error{color:#f85149}
        .output-area .info{color:#58a6ff}
        .file-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
        .file-chip{background:#1f6feb22;border:1px solid #1f6feb44;padding:8px 15px;border-radius:20px;font-size:13px;color:#58a6ff}
        .btn-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
    </style>
</head>
<body>
    <div class="header">
        <h1>☁️ Dapine Cloud</h1>
        <span>Data Pipeline Platform v3.0</span>
        <span style="color:#7ee787;margin-left:auto">● Online</span>
    </div>
    
    <div class="container">
        <div class="panel">
            <div class="panel-header">📂 Upload Data</div>
            <div class="panel-body">
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                    <p style="font-size:40px;margin-bottom:10px">📁</p>
                    <p>Drop CSV or Excel file here</p>
                    <p style="color:#8b949e;font-size:12px">or click to browse</p>
                </div>
                <input type="file" id="fileInput" accept=".csv,.xlsx" style="display:none" onchange="handleUpload(this.files[0])">
                <div class="file-list" id="fileList"></div>
                <div class="btn-row">
                    <button class="btn btn-secondary" onclick="validateData()">🔍 Validate</button>
                    <button class="btn btn-purple" onclick="incrementalRun()">🔄 Check New</button>
                </div>
            </div>
        </div>
        
        <div class="panel">
            <div class="panel-header">📝 Dapine Pipeline</div>
            <div class="panel-body">
                <textarea id="codeInput" placeholder="read &quot;file.csv&quot; as raw&#10;print raw&#10;stats raw">read "submission (6).csv" as raw
print raw
stats raw</textarea>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="runPipeline()">▶ Run</button>
                    <button class="btn btn-secondary" onclick="savePipeline()">💾 Save</button>
                </div>
            </div>
        </div>
        
        <div class="panel" style="grid-column:span 2">
            <div class="panel-header">📤 Output</div>
            <div class="panel-body">
                <div class="output-area" id="output">Ready. Upload a CSV and click ▶ Run.</div>
            </div>
        </div>
    </div>
    
    <script>
        const API = 'https://dapine-cloud.onrender.com/api';
        let currentFile = null;
        
        const zone = document.getElementById('uploadZone');
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover') });
        zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
        zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.classList.remove('dragover');
            handleUpload(e.dataTransfer.files[0]);
        });
        
        async function handleUpload(file) {
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            document.getElementById('output').innerHTML = '<span class="info">⏳ Uploading...</span>';
            try {
                const res = await fetch(`${API}/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                if (data.error) {
                    document.getElementById('output').innerHTML = `<span class="error">❌ ${data.error}</span>`;
                    return;
                }
                currentFile = data.filename;
                document.getElementById('fileList').innerHTML = `<div class="file-chip">📄 ${data.filename} (${data.rows} rows, ${data.columns.length} cols)</div>`;
                document.getElementById('output').innerHTML = `<span class="success">✅ Uploaded: ${data.filename}</span>\n<span class="info">📊 ${data.rows} rows, Columns: ${data.columns.join(', ')}</span>`;
            } catch(e) {
                document.getElementById('output').innerHTML = `<span class="error">❌ ${e.message}</span>`;
            }
        }
        
        async function runPipeline() {
            const code = document.getElementById('codeInput').value;
            if (!code) return alert('Write some Dapine code first!');
            document.getElementById('output').innerHTML = '<span class="info">⏳ Running...</span>';
            try {
                const res = await fetch(`${API}/run`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ code, filename: currentFile || 'data.csv' })
                });
                const data = await res.json();
                let html = `<span class="success">✅ Pipeline ${data.pipeline_id} completed!</span>\n`;
                if (data.stdout) html += data.stdout;
                if (data.stderr) html += `\n<span class="error">${data.stderr}</span>`;
                if (data.outputs?.length) html += `\n<span class="info">📁 Outputs: ${data.outputs.join(', ')}</span>`;
                if (data.chart_url) html += `\n<span class="info">📊 <a href="${data.chart_url}" target="_blank" style="color:#58a6ff">Open Chart</a></span>`;
                document.getElementById('output').innerHTML = html;
            } catch(e) {
                document.getElementById('output').innerHTML = `<span class="error">❌ ${e.message}</span>`;
            }
        }
        
        async function validateData() {
            if (!currentFile) return alert('Upload a file first!');
            document.getElementById('output').innerHTML = '<span class="info">🔍 Validating...</span>';
            try {
                const res = await fetch(`${API}/validate`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename: currentFile, rules: ['label >= 0', 'label <= 1']})
                });
                const data = await res.json();
                let html = `<span class="success">✅ Validation Complete</span>\n`;
                html += `📊 Total Rows: ${data.total_rows}\n`;
                html += `✅ Passed: ${data.rules_passed} | ❌ Failed: ${data.rules_failed}\n\n`;
                html += `<span class="info">📋 Data Quality:</span>\n`;
                if (data.quality) {
                    for (const [col, stats] of Object.entries(data.quality)) {
                        html += `  ${col}: ${stats.null_pct}% null, ${stats.numeric_pct}% numeric\n`;
                    }
                }
                if (data.errors?.length) {
                    html += `\n<span class="error">⚠️ Errors:</span>\n`;
                    data.errors.forEach(e => html += `  - ${e}\n`);
                }
                document.getElementById('output').innerHTML = html;
            } catch(e) {
                document.getElementById('output').innerHTML = `<span class="error">❌ ${e.message}</span>`;
            }
        }
        
        async function incrementalRun() {
            if (!currentFile) return alert('Upload a file first!');
            document.getElementById('output').innerHTML = '<span class="info">🔄 Checking for new data...</span>';
            try {
                const res = await fetch(`${API}/incremental`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename: currentFile, pipeline: 'default'})
                });
                const data = await res.json();
                let html = `<span class="success">🔄 Incremental Check</span>\n`;
                html += `Status: ${data.status}\n`;
                html += `New Rows: ${data.new_rows || 0} | Total: ${data.total_rows || 0}\n`;
                if (data.preview) {
                    html += `\n<span class="info">📋 Preview of new rows:</span>\n`;
                    html += JSON.stringify(data.preview.slice(0,3), null, 2);
                }
                document.getElementById('output').innerHTML = html;
            } catch(e) {
                document.getElementById('output').innerHTML = `<span class="error">❌ ${e.message}</span>`;
            }
        }
        
        function savePipeline() {
            const code = document.getElementById('codeInput').value;
            const blob = new Blob([code], {type:'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'pipeline.dap';
            a.click();
        }
        
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 'Enter') runPipeline();
        });
    </script>
</body>
</html>
